name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          # read:packages token for @slovensky-futbalovy-zvaz/design-system (ADR 0016)
          NPM_GITHUB_TOKEN: ${{ secrets.NPM_GITHUB_TOKEN }}
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Visual regression of the SFZ design layer (R3.4, ADR 0019); baselines are Linux screenshots in e2e/__screenshots__.
      # GitHub's Ubuntu runner already has the system libraries for Chromium, so only the browser is downloaded.
      - run: npx playwright install --only-shell chromium
      # Missing baselines are written, then the next step fails until they are committed (see RUNBOOK)
      - run: npm run test:e2e -- --update-snapshots=missing
      - name: Fail on new baseline screenshots
        run: |
          if [ -n "$(git status --porcelain e2e/__screenshots__)" ]; then
            echo "::error::New baseline screenshots – download the artifact 'playwright-report' and commit e2e/__screenshots__ (RUNBOOK)."
            exit 1
          fi
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            e2e/__screenshots__/
          retention-days: 7
